<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <linearGradient id="mantisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#0A0E27" />
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#mantisGradient)" stroke-width="2" opacity="0.3" />
  
  <!-- Mantis head -->
  <g filter="url(#glow)">
    <!-- Head shape -->
    <path d="M 100 40 L 110 45 L 115 55 L 110 65 L 100 70 L 90 65 L 85 55 L 90 45 Z" 
          fill="url(#mantisGradient)" stroke="#FF6B35" stroke-width="1.5"/>
    
    <!-- Eyes -->
    <circle cx="95" cy="55" r="3" fill="#FFB84D" filter="url(#glow)"/>
    <circle cx="105" cy="55" r="3" fill="#FFB84D" filter="url(#glow)"/>
    <circle cx="95" cy="55" r="1.5" fill="#0A0E27"/>
    <circle cx="105" cy="55" r="1.5" fill="#0A0E27"/>
  </g>
  
  <!-- Front left leg -->
  <g filter="url(#glow)">
    <path d="M 90 65 Q 75 75 70 100 Q 68 115 75 130" 
          stroke="url(#mantisGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="75" cy="130" r="2.5" fill="#FF6B35"/>
  </g>
  
  <!-- Front right leg -->
  <g filter="url(#glow)">
    <path d="M 110 65 Q 125 75 130 100 Q 132 115 125 130" 
          stroke="url(#mantisGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="125" cy="130" r="2.5" fill="#FF6B35"/>
  </g>
  
  <!-- Middle left leg -->
  <g filter="url(#glow)">
    <path d="M 88 70 Q 70 85 65 115 Q 63 130 72 145" 
          stroke="url(#mantisGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <circle cx="72" cy="145" r="2" fill="#FF6B35"/>
  </g>
  
  <!-- Middle right leg -->
  <g filter="url(#glow)">
    <path d="M 112 70 Q 130 85 135 115 Q 137 130 128 145" 
          stroke="url(#mantisGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <circle cx="128" cy="145" r="2" fill="#FF6B35"/>
  </g>
  
  <!-- Back left leg -->
  <g filter="url(#glow)">
    <path d="M 92 72 Q 75 100 72 140 Q 71 155 82 165" 
          stroke="url(#mantisGradient)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <circle cx="82" cy="165" r="1.5" fill="#FF6B35"/>
  </g>
  
  <!-- Back right leg -->
  <g filter="url(#glow)">
    <path d="M 108 72 Q 125 100 128 140 Q 129 155 118 165" 
          stroke="url(#mantisGradient)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <circle cx="118" cy="165" r="1.5" fill="#FF6B35"/>
  </g>
  
  <!-- Abdomen -->
  <ellipse cx="100" cy="110" rx="12" ry="35" 
           fill="url(#mantisGradient)" opacity="0.7" stroke="#FF6B35" stroke-width="1"/>
  
  <!-- Accent lines for detail -->
  <line x1="100" y1="75" x2="100" y2="145" stroke="url(#mantisGradient)" stroke-width="1.5" opacity="0.4"/>
</svg>
