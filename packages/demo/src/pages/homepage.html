<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Mantis - Lightweight Web Proxy</title>
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				width: 100vw;
				height: 100vh;
				background: #000000;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			}
			.container {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 2.5rem;
				width: 100%;
				max-width: 600px;
				padding: 2rem;
			}
			.title {
				font-size: 4.5rem;
				font-weight: 700;
				letter-spacing: -2px;
				background: linear-gradient(135deg, #FF6B35 0%, #FFB84D 100%);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
				text-align: center;
				margin: 0;
			}
			.subtitle {
				font-size: 0.95rem;
				color: #888888;
				letter-spacing: 0.5px;
				text-transform: uppercase;
				font-weight: 500;
				text-align: center;
				margin: 0;
			}
			.search-container {
				width: 100%;
				max-width: 500px;
			}
			.search-form {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				background: #111111;
				border: 1px solid #333333;
				border-radius: 12px;
				padding: 0.75rem 1.25rem;
				transition: all 0.3s ease;
			}
			.search-form:focus-within {
				border-color: #FF6B35;
				box-shadow: 0 0 20px rgba(255, 107, 53, 0.2);
			}
			.search-input {
				flex: 1;
				background: transparent;
				border: none;
				color: #ffffff;
				font-size: 1rem;
				outline: none;
				font-family: inherit;
			}
			.search-input::placeholder {
				color: #666666;
			}
			.search-button {
				background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
				border: none;
				color: white;
				padding: 0.5rem 1rem;
				border-radius: 6px;
				cursor: pointer;
				font-weight: 600;
				font-size: 0.9rem;
				transition: all 0.2s ease;
				flex-shrink: 0;
			}
			.search-button:hover {
				transform: translateY(-2px);
				box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
			}
			.search-button:active {
				transform: translateY(0);
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1 class="title">MANTIS</h1>
			<p class="subtitle">Your Proxy is completed, and ready to get customized</p>
			
			<div class="search-container">
				<form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
					<input
						type="text"
						class="search-input"
						id="urlInput"
						placeholder="Enter URL or search..."
						spellcheck="false"
						autofocus
					/>
					<button type="submit" class="search-button">Go</button>
				</form>
			</div>
		</div>

		<script>
			function handleSearch(e) {
				e.preventDefault();
				let url = document.getElementById('urlInput').value.trim();
				if (!url) return;
				
				// Add https:// if no protocol specified
				if (!url.startsWith('http://') && !url.startsWith('https://')) {
					url = `https://${url}`;
				}
				
				// Send message to parent window
				window.parent.postMessage({
					type: 'mantis:navigate',
					url: url
				}, '*');
			}
		</script>
	</body>
</html>
